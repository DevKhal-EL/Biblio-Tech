<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblio-Tech - Usuários Cadastrados</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container-principal">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">📚</span>
                    <h1>Biblio-Tech</h1>
                </div>
            </div>
        </header>

        <!-- Main layout: Sidebar + Conteúdo -->
        <div class="layout">
            <!-- Navegação Lateral -->
            <nav class="sidebar">
                <ul class="nav-menu">
                    <li><a href="../index.html" class="nav-link"><img src="../assets/icons/logo_home.png" alt="home" class="home-icon">Início</a></li>
                    <li><a href="catalogo-livros.html" class="nav-link"><img src="../assets/icons/livros.png" alt="livros" class="livros-icon">Livros</a></li>
                    <li><a href="consulta.html" class="nav-link"><img src="../assets/icons/setinha.png" alt="setinha" class="setinha-icon">Consulta</a></li>
                    <li><a href="usuarios-cadastrados.html" class="nav-link ativo"><img src="../assets/icons/usuarios.png" alt="users" class="users-icon">Usuários</a></li>
                    <li><a href="cadastro-usuarios.html" class="nav-link"><img src="../assets/icons/cadastro.png" alt="Cadastro User" class="cad-user-icon">Cadastrar Usuário</a></li>
                    <li><a href="emprestimos.html" class="nav-link"><img src="../assets/icons/empréstimo.png" alt="emprestimo" class="emprestimo-icon">Emprestar Livro</a></li>
                    <li><a href="cadastro-livros.html" class="nav-link"><img src="../assets/icons/cadastrar-livro.png" alt="cad-livro" class="cad-livro-icon">Cadastrar Livro</a></li>
                    <li><a href="devolucao.html" class="nav-link"><img src="../assets/icons/setinha_verde.png" alt="devolver-icon" class="devolver-icon">Devolver Livro</a></li>
                </ul>
                <button class="btn-sair">Sair</button>
            </nav>

            <!-- Conteúdo Principal -->
            <main class="conteudo-principal">
                <section class="pagina-usuarios">
                    <!-- Título da página -->
                    <div class="titulo-secao">
                        <h2>Usuários Cadastrados</h2>
                        <p class="subtitulo">Visualize os usuários cadastrados</p>
                    </div>

                    <!-- Filtro e Busca -->
                    <section class="filtro-usuarios">
                        <div class="filtro-usuarios-container">
                            <div class="input-pesquisa-usuarios-wrapper">
                                <span class="icon-pesquisa">🔍</span>
                                <input 
                                    type="text" 
                                    id="input-pesquisa-usuarios" 
                                    class="input-pesquisa-usuarios" 
                                    placeholder="Pesquisar usuário"
                                >
                            </div>
                            <button class="btn-buscar-usuarios">Buscar</button>
                        </div>
                    </section>

                    <!-- Tabela de Usuários -->
                    <section class="tabela-usuarios-container">
                        <table class="tabela-usuarios">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Email</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-tabela-usuarios">
                                <!-- Dados serão inseridos via JavaScript -->
                            </tbody>
                        </table>
                    </section>

                    <!-- Paginação -->
                    <section class="paginacao-usuarios">
                        <button class="btn-paginacao-usuarios" id="btn-anterior-usuarios">
                            <
                        </button>
                        <div class="numeros-pagina-usuarios" id="numeros-pagina-usuarios">
                            <!-- Números de página serão inseridos via JavaScript -->
                        </div>
                        <button class="btn-paginacao-usuarios" id="btn-proxima-usuarios">
                            >
                        </button>
                    </section>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
